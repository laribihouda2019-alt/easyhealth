name: easyhealth_flutter
description: EasyHealth Flutter Application
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API
  dio: ^5.3.2
  http: ^1.1.0
  
  # Storage & Security
  flutter_secure_storage: ^8.0.0
  shared_preferences: ^2.2.2
  
  # Image & File Handling
  image_picker: ^1.0.4
  file_picker: ^6.1.1
  cached_network_image: ^3.3.0
  
  # JSON & Serialization
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1
  
  # Authentication
  jwt_decode: ^0.3.3
  
  # UI Components
  cupertino_icons: ^1.0.2
  
  # State Management
  provider: ^6.1.1
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
